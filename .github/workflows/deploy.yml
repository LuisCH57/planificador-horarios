# Publica la aplicación en GitHub Pages cada vez que se hace push a "main".
# Basado en el ejemplo oficial de Vite: https://vite.dev/guide/static-deploy
name: Publicar en GitHub Pages

on:
  # Se ejecuta con cada push a la rama main
  push:
    branches: ['main']

  # Permite ejecutarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos que necesita para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo una publicación a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Una computadora temporal con Linux que GitHub presta para el proceso
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Instalar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar la aplicación
        run: npm run build
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Subir la carpeta compilada
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
